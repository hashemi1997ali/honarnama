plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream -> localProperties.load(stream) }
}

def buildConfigString = { String name, String fallback ->
    def value = localProperties.getProperty(name) ?: System.getenv(name) ?: fallback
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace 'ir.hashemi.market'
    compileSdk 37

    defaultConfig {
        applicationId "ir.hashemi.market"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"

        buildConfigField 'String', 'BACKEND_URL', buildConfigString('BACKEND_URL', 'https://example.invalid/panel/')
        buildConfigField 'String', 'SECURITY_CODE', buildConfigString('SECURITY_CODE', 'change-me')
        buildConfigField 'String', 'CONTACT_EMAIL', buildConfigString('CONTACT_EMAIL', 'contact@example.com')

    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.viewpager:viewpager:1.1.0'
    implementation 'com.google.android.material:material:1.14.0'

    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.github.bumptech.glide:glide:5.0.9'
}
