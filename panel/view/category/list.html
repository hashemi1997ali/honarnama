<section class="panel-page">
    <md-card class="panel-card panel-table-card md-whiteframe-1dp">
        <div class="table-responsive-vertical">
            <table class="table table-hover panel-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Icon</th>
                        <th>Name</th>
                        <th>Priority</th>
                        <th>Visibility</th>
                        <th>Updated</th>
                        <th class="panel-actions-heading">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="c in category">
                        <td data-title="ID">{{c.id}}</td>
                        <td data-title="Icon">
                            <button type="button" class="category-icon-button" ng-style="{'background-color': c.color}" ng-click="viewIcon($event, 'uploads/category/' + c.icon)">
                                <img class="category-thumbnail" ng-src="uploads/category/{{c.icon}}" alt="{{c.name}}">
                            </button>
                        </td>
                        <td data-title="Name" class="panel-primary-cell">{{c.name}}</td>
                        <td data-title="Priority">{{c.priority}}</td>
                        <td data-title="Visibility">
                            <span class="status-chip status-chip-neutral" ng-if="c.draft == 1">Draft</span>
                            <span class="status-chip status-chip-info" ng-if="c.draft != 1">Published</span>
                        </td>
                        <td data-title="Updated">{{c.last_update | date:'dd MMM yyyy'}}</td>
                        <td data-title="Actions" class="panel-actions-cell">
                            <div class="panel-row-actions">
                                <md-button class="md-icon-button panel-action-button" aria-label="View category icon" ng-click="viewIcon($event, 'uploads/category/' + c.icon)">
                                    <md-icon>visibility</md-icon><md-tooltip>View icon</md-tooltip>
                                </md-button>
                                <md-button class="md-icon-button panel-action-button" aria-label="Edit category" ng-click="editCategory($event, c)">
                                    <md-icon>edit</md-icon><md-tooltip>Edit</md-tooltip>
                                </md-button>
                                <md-button class="md-icon-button panel-action-button panel-action-success" aria-label="Publish category" ng-if="c.draft == 1" ng-click="publishDialog($event, c)">
                                    <md-icon>publish</md-icon><md-tooltip>Publish</md-tooltip>
                                </md-button>
                                <md-button class="md-icon-button panel-action-button panel-action-danger" aria-label="Delete category" ng-click="deleteCategory($event, c)">
                                    <md-icon>delete</md-icon><md-tooltip>Delete</md-tooltip>
                                </md-button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div ng-if="loading" class="panel-state"><md-progress-circular md-mode="indeterminate" md-diameter="36"></md-progress-circular><p>Loading categories…</p></div>
            <div ng-if="!loading && category.length === 0" class="panel-state panel-empty-state"><md-icon>category</md-icon><p>No categories found.</p></div>
        </div>
        <div class="panel-pagination" ng-if="paging.total > 1">
            <cl-paging flex cl-pages="paging.total" cl-steps="paging.step" cl-page-changed="paging.onPageChanged()" cl-align="center center" cl-current-page="paging.current"></cl-paging>
        </div>
    </md-card>
</section>
