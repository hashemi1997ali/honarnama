<section class="panel-page">
    <md-card class="panel-card panel-table-card md-whiteframe-1dp">
        <div class="table-responsive-vertical">
            <table class="table table-hover panel-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Image</th>
                        <th>Title</th>
                        <th>Visibility</th>
                        <th>Placement</th>
                        <th>Updated</th>
                        <th class="panel-actions-heading">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="n in news">
                        <td data-title="ID">{{n.id}}</td>
                        <td data-title="Image"><img class="panel-thumbnail" ng-src="uploads/news/{{n.image}}" alt="{{n.title}}"></td>
                        <td data-title="Title" class="panel-primary-cell">{{n.title | cut:false:50:' …'}}</td>
                        <td data-title="Visibility">
                            <span class="status-chip status-chip-neutral" ng-if="n.draft == 1">Draft</span>
                            <span class="status-chip status-chip-info" ng-if="n.draft != 1">Published</span>
                        </td>
                        <td data-title="Placement">
                            <span class="status-chip status-chip-warning" ng-if="n.status === 'FEATURED'">Featured</span>
                            <span class="status-chip status-chip-neutral" ng-if="n.status !== 'FEATURED'">Normal</span>
                        </td>
                        <td data-title="Updated">{{n.last_update | date:'dd MMM yyyy'}}</td>
                        <td data-title="Actions" class="panel-actions-cell">
                            <div class="panel-row-actions">
                                <md-button class="md-icon-button panel-action-button" aria-label="View news details" ng-click="detailsNewsInfo($event, n)"><md-icon>visibility</md-icon><md-tooltip>Details</md-tooltip></md-button>
                                <md-button class="md-icon-button panel-action-button" aria-label="Edit news" ng-click="editNewsInfo($event, n)"><md-icon>edit</md-icon><md-tooltip>Edit</md-tooltip></md-button>
                                <md-button class="md-icon-button panel-action-button panel-action-success" aria-label="Publish news" ng-if="n.draft == 1" ng-click="publishDialog($event, n)"><md-icon>publish</md-icon><md-tooltip>Publish</md-tooltip></md-button>
                                <md-button class="md-icon-button panel-action-button panel-action-danger" aria-label="Delete news" ng-click="deleteNewsInfo($event, n)"><md-icon>delete</md-icon><md-tooltip>Delete</md-tooltip></md-button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div ng-if="loading" class="panel-state"><md-progress-circular md-mode="indeterminate" md-diameter="36"></md-progress-circular><p>Loading news…</p></div>
            <div ng-if="!loading && news.length === 0" class="panel-state panel-empty-state"><md-icon>article</md-icon><p>No news found.</p></div>
        </div>
        <div class="panel-pagination" ng-if="paging.total > 1">
            <cl-paging flex cl-pages="paging.total" cl-steps="paging.step" cl-page-changed="paging.onPageChanged()" cl-align="center center" cl-current-page="paging.current"></cl-paging>
        </div>
    </md-card>
</section>
